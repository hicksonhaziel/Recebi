# Copy outside the repository and replace placeholder values. Tool calls cannot
# override any value in this trusted local configuration.

[recebi]
cluster = "devnet"
genesis_hash = "EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG"
merchant_wallet = "11111111111111111111111111111111"
accepted_mint = "11111111111111111111111111111111"
token_decimals = 6
rpc_url = "https://api.devnet.solana.com"
# Use an absolute directory because ZeroClaw may spawn the process elsewhere.
data_dir = "/absolute/path/to/recebi-data"
ptax_policy = "strict_same_day"
max_open_reconcile = 10

# Optional deterministic QR delivery. When present, Recebi sends the rendered QR
# to the operator channel itself instead of depending on the model to emit an
# attachment marker. It grants no payment, signing, or configuration authority.
