[workspace]
members = ["crates/recebi-core", "crates/recebi-store", "apps/recebi-mcp"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"

[workspace.dependencies]
bs58 = "0.5"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
percent-encoding = "2.3"
qrcode = { version = "0.14.1", default-features = false, features = ["image"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
solana-pubkey = { version = "=4.2.0", features = ["curve25519"] }
solana-message = { version = "=4.2.4", features = ["wincode"] }
solana-signature = "=3.4.1"
solana-transaction = { version = "=4.1.5", features = ["wincode"] }
spl-token-interface = "=3.0.0"
tempfile = "3.14"
thiserror = "2.0"
toml = "0.9"
url = { version = "2.5", features = ["serde"] }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
wincode = "=0.5.5"
